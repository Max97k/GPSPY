name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK 37
        run: |
          export PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --channel=3 "platforms;android-37.0" || sdkmanager "platforms;android-37.0" || sdkmanager --channel=3 "platforms;android-37" || sdkmanager "platforms;android-37"
          ANDROID_SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$ANDROID_SDK_PATH/platforms/android-37.0" ] && [ ! -e "$ANDROID_SDK_PATH/platforms/android-37" ]; then
            ln -s "$ANDROID_SDK_PATH/platforms/android-37.0" "$ANDROID_SDK_PATH/platforms/android-37"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: check-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK 37
        run: |
          export PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --channel=3 "platforms;android-37.0" || sdkmanager "platforms;android-37.0" || sdkmanager --channel=3 "platforms;android-37" || sdkmanager "platforms;android-37"
          ANDROID_SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$ANDROID_SDK_PATH/platforms/android-37.0" ] && [ ! -e "$ANDROID_SDK_PATH/platforms/android-37" ]; then
            ln -s "$ANDROID_SDK_PATH/platforms/android-37.0" "$ANDROID_SDK_PATH/platforms/android-37"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
