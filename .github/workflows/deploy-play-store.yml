name: Deploy to Google Play Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v1.0.1)'
        required: false
        default: ''

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK 37
        run: |
          export PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --channel=3 "platforms;android-37.0" || sdkmanager "platforms;android-37.0" || sdkmanager --channel=3 "platforms;android-37" || sdkmanager "platforms;android-37"
          ANDROID_SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_PATH/tools/support"
          if [ ! -f "$ANDROID_SDK_PATH/tools/support/annotations.jar" ]; then
            TMP_DIR=$(mktemp -d)
            jar -cf "$ANDROID_SDK_PATH/tools/support/annotations.jar" -C "$TMP_DIR" .
            rm -rf "$TMP_DIR"
          fi
          if [ -d "$ANDROID_SDK_PATH/platforms/android-37.0" ] && [ ! -d "$ANDROID_SDK_PATH/platforms/android-37" ]; then
            cp -r "$ANDROID_SDK_PATH/platforms/android-37.0" "$ANDROID_SDK_PATH/platforms/android-37"
            if [ -f "$ANDROID_SDK_PATH/platforms/android-37/package.xml" ]; then
              sed -i 's/platforms;android-37.0/platforms;android-37/g' "$ANDROID_SDK_PATH/platforms/android-37/package.xml"
            fi
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > release.keystore
            mkdir -p app/build
            cp release.keystore app/build/release.keystore
          fi

      - name: Build and Sign Release App Bundle (AAB) & APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      # Upload AAB to Google Play Console Internal Track
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON || secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.gpsspy.gpstracker
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew

      # Create GitHub Release with Artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
